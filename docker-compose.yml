version: '3.9'
services:
  db:
    image: mysql:8.4.2
    command: mysqld --default-authentication-plugin=mysql_native_password
    restart: always
    environment:
      TZ: America/Sao_Paulo
      MYSQL_ROOT_PASSWORD: admin123
      MYSQL_USER: docker
      MYSQL_PASSWORD: admin123
      MYSQL_DATABASE: rest_with_spring_boot
      MYSQL_ROOT_HOST: '%'
      MYSQL_TCP_PORT: 3306
    ports:
      - "3308:3306"
    expose:
      - 3308
    networks:
      - artudev-network
  rest-with-spring-boot:
    image: artucorreia/rest-with-spring-boot
    restart: always
    build: ./first-project
    working_dir: /first-project
    environment:
      TZ: America/Sao_Paulo
      SPRING.DATASOURCE.URL: jdbc:mysql://localhost:3306/rest_with_spring_boot?useTimezone=true&serverTimezone=UTC
      SPRING.DATASOURCE.USERNAME:
      SPRING.DATASOURCE.PASSWORD:




networks:
  artudev-network:
    driver: bridge
